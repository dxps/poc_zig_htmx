<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your password · Northstar</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="centered-page">
    <main class="auth-card initial-card">
        <span class="step-badge">Required first step</span>
        <div>
            <span class="eyebrow">Welcome, { display_name }</span>
            <h1>Create your private password.</h1>
            <p>Before accessing Northstar, replace the initial password supplied by your administrator.</p>
        </div>
        if (has_error) {
            <p class="notice error" role="alert">{ error_message }</p>
        }
        <form class="form-stack" method="post" action="/account/initial-password">
            <label>
                <span>Initial password</span>
                <input name="current_password" type="password" autocomplete="current-password" required autofocus>
            </label>
            <label>
                <span>New password</span>
                <input name="new_password" type="password" autocomplete="new-password" minlength="10" required>
            </label>
            <label>
                <span>Confirm new password</span>
                <input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required>
            </label>
            <button class="button primary wide" type="submit">Set password and continue</button>
        </form>
        <form method="post" action="/logout">
            <button class="text-button" type="submit">Sign out instead</button>
        </form>
    </main>
</body>
</html>
